<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"
th:replace="~{layouts/app :: layout(~{::section}, 'Référentiels')}"><head><title>Référentiels</title></head>
<body><section><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px"><div><span class="badge badge-blue">Administration</span><h1 style="font:700 26px 'Space Grotesk';color:var(--text-primary);margin:8px 0">Référentiels administratifs</h1><p style="font-size:13px;color:var(--text-secondary)">Maîtres d'ouvrage, communes, secteurs et partenaires.</p></div></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px">
<div class="panel" style="padding:20px"><h3 style="font:600 15px 'Space Grotesk';color:var(--text-primary)">Maîtres d'Ouvrage</h3><form th:if="${isSuperAdmin}" th:action="@{/referentiels/maitres-ouvrage}" method="post" style="display:flex;gap:8px;margin:14px 0"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input class="field" name="nom" placeholder="Nom" required><button class="btn btn-blue btn-sm">Ajouter</button></form><div th:each="x:${maitresOuvrage}" style="padding:8px 0;border-top:1px solid var(--border-dim);font-size:12px;color:var(--text-primary)" th:text="${x.nom}">MO</div></div>
<div class="panel" style="padding:20px"><h3 style="font:600 15px 'Space Grotesk';color:var(--text-primary)">Communes</h3><form th:if="${isSuperAdmin}" th:action="@{/referentiels/communes}" method="post" style="display:flex;gap:8px;margin:14px 0"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input class="field" name="nom" placeholder="Nom" required><button class="btn btn-blue btn-sm">Ajouter</button></form><div th:each="x:${communes}" style="padding:8px 0;border-top:1px solid var(--border-dim);font-size:12px;color:var(--text-primary)" th:text="${x.nom}">Commune</div></div>
<div class="panel" style="padding:20px"><h3 style="font:600 15px 'Space Grotesk';color:var(--text-primary)">Secteurs</h3><form th:if="${isSuperAdmin}" th:action="@{/referentiels/secteurs}" method="post" style="display:flex;gap:8px;margin:14px 0"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input class="field" name="nom" placeholder="Nom" required><button class="btn btn-blue btn-sm">Ajouter</button></form><div th:each="x:${secteurs}" style="padding:8px 0;border-top:1px solid var(--border-dim);font-size:12px;color:var(--text-primary)" th:text="${x.nom}">Secteur</div></div>
<div class="panel" style="padding:20px"><h3 style="font:600 15px 'Space Grotesk';color:var(--text-primary)">Partenaires</h3><form th:if="${isSuperAdmin}" th:action="@{/referentiels/partenaires}" method="post" style="display:grid;grid-template-columns:90px 1fr auto;gap:8px;margin:14px 0"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input class="field" name="code" placeholder="CODE" required><input class="field" name="nom" placeholder="Nom" required><button class="btn btn-blue btn-sm">+</button></form><div th:each="x:${partenaires}" style="padding:8px 0;border-top:1px solid var(--border-dim);font-size:12px"><span class="badge badge-violet" th:text="${x.code}">CODE</span> <span th:text="${x.nom}" style="color:var(--text-primary)">Partenaire</span></div></div></div></section></body></html>
