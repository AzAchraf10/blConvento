<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"
th:replace="~{layouts/app :: layout(~{::section}, 'Traçabilité Audit')}"><head><title>Traçabilité Audit</title></head>
<body><section><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px"><div><span class="badge badge-violet">Audit</span><h1 style="font:700 26px 'Space Grotesk';color:var(--text-primary);margin:8px 0">Traçabilité des actions</h1></div><form th:action="@{/historique/clear}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-ghost btn-sm" type="submit">Vider l'historique</button></form></div>
<div class="panel" style="overflow:hidden"><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Date</th><th>Agent</th><th>Convention</th><th>Action</th><th></th></tr></thead><tbody>
<tr th:each="h:${historiques}"><td th:text="${#temporals.format(h.dateAction,'dd/MM/yyyy HH:mm')}">date</td><td th:text="${h.user != null ? h.user.nom : 'Agent DSIT'}">Agent</td><td th:text="${h.convention != null ? h.convention.intitule : '—'}">—</td><td th:text="${h.action}">Action</td><td><form th:action="@{/historique/{id}/delete(id=${h.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-ghost btn-sm">Supprimer</button></form></td></tr>
<tr th:if="${#lists.isEmpty(historiques)}"><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted)">Aucune action enregistrée.</td></tr></tbody></table></div></div></section></body></html>
