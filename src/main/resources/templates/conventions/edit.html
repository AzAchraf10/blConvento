<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"
th:replace="~{layouts/app :: layout(~{::section}, 'Nouvelle convention')}"><head><title>Nouvelle convention</title></head>
<body><section><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap"><div><span class="badge badge-blue">Gestion des conventions</span><h1 style="font:700 26px 'Space Grotesk';color:var(--text-primary);margin:8px 0 6px" th:text="${formTitle}">Nouvelle convention</h1><p style="font-size:13px;color:var(--text-secondary)">Renseignez les informations de la convention et ses partenaires.</p></div><a th:href="@{/conventions}" class="btn btn-ghost btn-sm">← Retour</a></div>
<form th:action="${formAction}" method="post" enctype="multipart/form-data" class="panel" style="padding:24px">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px">
<div><label class="field-label">Intitulé *</label><input class="field" type="text" name="intitule" required th:value="${conventionRequest.intitule}"></div>
<div><label class="field-label">Maître d'Ouvrage *</label><select class="field" name="idMaitreOuvrage" required><option value="">Sélectionner</option><option th:each="mo:${maitresOuvrage}" th:value="${mo.id}" th:text="${mo.nom}" th:selected="${conventionRequest.idMaitreOuvrage == mo.id}">MO</option></select></div>
<div style="grid-column:1/-1"><label class="field-label">Objet *</label><textarea class="field" name="objet" rows="4" required th:text="${conventionRequest.objet}"></textarea></div>
<div><label class="field-label">Date de début *</label><input class="field" type="date" name="dateDebut" required th:value="${conventionRequest.dateDebut}"></div>
<div><label class="field-label">Date de fin *</label><input class="field" type="date" name="dateFin" required th:value="${conventionRequest.dateFin}"></div>
<div><label class="field-label">Montant (DH) *</label><input class="field" type="number" step="0.01" min="0" name="montant" required th:value="${conventionRequest.montant}"></div>
<div><label class="field-label">Taux d'engagement (%) *</label><input class="field" type="number" step="0.1" min="0" max="100" name="tauxEngagement" required th:value="${conventionRequest.tauxEngagement}"></div>
<div><label class="field-label">Statut signature *</label><select class="field" name="statutSignature" required><option value="Totale" th:selected="${conventionRequest.statutSignature == 'Totale'}">Totale</option><option value="Partielle" th:selected="${conventionRequest.statutSignature == 'Partielle'}">Partielle</option><option value="Aucune" th:selected="${conventionRequest.statutSignature == 'Aucune'}">Aucune</option></select></div>
<div><label class="field-label">Statut exécution *</label><select class="field" name="statutExecution" required><option value="En attente" th:selected="${conventionRequest.statutExecution == 'En attente'}">En attente</option><option value="En cours" th:selected="${conventionRequest.statutExecution == 'En cours'}">En cours</option><option value="Terminée" th:selected="${conventionRequest.statutExecution == 'Terminée'}">Terminée</option><option value="Annulée" th:selected="${conventionRequest.statutExecution == 'Annulée'}">Annulée</option></select></div>
<div style="grid-column:1/-1"><label class="field-label">Document PDF</label><input class="field" type="file" name="fichierPdf" accept="application/pdf"></div></div>
<div style="margin-top:24px;border-top:1px solid var(--border-dim);padding-top:20px"><h3 style="font:600 15px 'Space Grotesk';color:var(--text-primary)">Communes</h3><div style="display:flex;flex-wrap:wrap;gap:10px"><label th:each="c:${communes}" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)"><input type="checkbox" name="communes" th:value="${c.id}" th:checked="${conventionRequest.communes.contains(c.id)}"><span th:text="${c.nom}">Commune</span></label></div></div>
<div style="margin-top:20px"><h3 style="font:600 15px 'Space Grotesk';color:var(--text-primary)">Secteurs</h3><div style="display:flex;flex-wrap:wrap;gap:10px"><label th:each="s:${secteurs}" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)"><input type="checkbox" name="secteurs" th:value="${s.id}" th:checked="${conventionRequest.secteurs.contains(s.id)}"><span th:text="${s.nom}">Secteur</span></label></div></div>
<div style="margin-top:20px"><h3 style="font:600 15px 'Space Grotesk';color:var(--text-primary)">Partenaires</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px"><label th:each="p:${partenaires}" class="panel" style="padding:12px;display:flex;align-items:center;gap:8px"><input type="checkbox" name="partenaireCodes" th:value="${p.code}" th:checked="${conventionRequest.partenaireCodes.contains(p.code)}"><span class="badge badge-violet" th:text="${p.code}">CODE</span><span style="font-size:12px;color:var(--text-primary)" th:text="${p.nom}">Partenaire</span></label></div></div>
<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:28px"><a th:href="@{/conventions}" class="btn btn-ghost">Annuler</a><button type="submit" class="btn btn-blue" th:text="${submitLabel}">Enregistrer</button></div></form></section></body></html>
