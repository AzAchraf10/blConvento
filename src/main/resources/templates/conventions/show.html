<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"
th:replace="~{layouts/app :: layout(~{::section}, 'Détail de la convention')}"><head><title>Détail de la convention</title></head>
<body><section><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:24px"><div><span class="badge badge-blue" th:text="'Convention N°'+${convention.id}">Convention</span><h1 style="font:700 28px 'Space Grotesk';color:var(--text-primary);margin:8px 0 6px" th:text="${convention.intitule}">Convention</h1><p style="font-size:12px;color:var(--text-secondary)" th:text="${convention.dateDebut}+' → '+${convention.dateFin}">Dates</p></div>
<div style="display:flex;gap:8px"><a th:if="${isAdmin}" th:href="@{/conventions/{id}/edit(id=${convention.id})}" class="btn btn-blue btn-sm">✎ Modifier</a><form th:if="${isAdmin and !convention.archived}" th:action="@{/conventions/{id}/archive(id=${convention.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-ghost btn-sm" type="submit">Archiver</button></form></div></div>
<div style="display:grid;grid-template-columns:2fr 1fr;gap:20px">
<div class="panel"><div class="panel-header" style="padding:14px 20px">Objet</div><div style="padding:20px;color:var(--text-primary);line-height:1.7" th:text="${convention.objet}">Objet</div></div>
<div class="panel" style="padding:20px"><div class="field-label">Maître d'Ouvrage</div><div style="font-weight:600;color:var(--text-primary);margin-bottom:18px" th:text="${convention.maitreOuvrage.nom}">—</div>
<div class="field-label">Montant</div><div style="font:700 22px 'Space Grotesk';color:var(--gold-hi);margin-bottom:18px" th:text="${#numbers.formatDecimal(convention.montant,1,2)}+' DH'">0 DH</div>
<div class="field-label">Engagement</div><div style="font:700 30px 'Space Grotesk';color:var(--emerald-hi)" th:text="${convention.tauxEngagement}+'%'">0%</div></div></div>
<div class="panel" style="margin-top:20px;padding:20px"><div style="display:flex;gap:10px;flex-wrap:wrap"><span class="badge badge-blue" th:text="'Signature : '+${convention.statutSignature}">Signature</span><span class="badge badge-dim" th:text="'Exécution : '+${convention.statutExecution}">Exécution</span><span th:if="${convention.archived}" class="badge badge-gold">Archivée</span></div>
<div th:if="${convention.cheminFichierPdf != null}" style="margin-top:16px"><a th:href="@{/files/{name}(name=${convention.cheminFichierPdf})}" class="btn btn-ghost btn-sm" target="_blank">▣ Consulter le PDF</a></div></div></section></body></html>
