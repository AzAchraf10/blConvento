<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"
th:replace="~{layouts/app :: layout(~{::section}, 'Archives')}"><head><title>Archives</title></head>
<body><section><div style="margin-bottom:24px"><span class="badge badge-emerald">Archives</span><h1 style="font:700 26px 'Space Grotesk';color:var(--text-primary);margin:8px 0">Conventions archivées</h1><p style="font-size:13px;color:var(--text-secondary)">Historique des conventions retirées du registre actif.</p></div>
<div class="panel" style="overflow:hidden"><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Convention</th><th>Maître d'ouvrage</th><th>Exécution</th><th>Engagement</th><th>Action</th></tr></thead><tbody>
<tr th:each="c:${conventions}"><td><a th:href="@{/conventions/{id}(id=${c.id})}" th:text="${c.intitule}" style="font-weight:600;color:var(--text-primary)">Convention</a></td><td th:text="${c.maitreOuvrage.nom}">—</td><td th:text="${c.statutExecution}">—</td><td th:text="${c.tauxEngagement}+'%'">0%</td><td><form th:if="${isAdmin}" th:action="@{/conventions/{id}/restore(id=${c.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-ghost btn-sm" type="submit">↻ Restaurer</button></form></td></tr>
<tr th:if="${#lists.isEmpty(conventions)}"><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted)">Aucune archive.</td></tr></tbody></table></div></div></section></body></html>
