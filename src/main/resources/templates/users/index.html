<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"
th:replace="~{layouts/app :: layout(~{::section}, 'Gestion des utilisateurs')}"><head><title>Gestion des utilisateurs</title></head>
<body><section><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px"><div><span class="badge badge-blue">Gestion des Accès</span><h1 style="font:700 26px 'Space Grotesk';color:var(--text-primary);margin:8px 0">Agents & Comptes Utilisateurs</h1><p style="font-size:13px;color:var(--text-secondary)">Administration des comptes et des accès au système provincial DSIT.</p></div></div>
<div style="display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start"><div class="panel" style="padding:20px"><h3 style="font:600 14px 'Space Grotesk';color:var(--text-primary)">Créer un nouvel agent</h3><form th:action="@{/users}" method="post" style="display:flex;flex-direction:column;gap:12px;margin-top:16px"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input class="field" name="nom" placeholder="Nom & prénom" required><input class="field" type="email" name="email" placeholder="E-mail" required><input class="field" type="password" name="password" placeholder="Mot de passe" required><select class="field" name="role" required><option value="ADMIN">Administrateur</option><option value="CONSULTATION">Consultation</option><option value="SUPER_ADMIN">Super Admin</option></select><button class="btn btn-blue">Enregistrer</button></form></div>
<div class="panel" style="overflow:hidden"><div class="panel-header" style="padding:14px 20px"><span style="font:600 14px 'Space Grotesk';color:var(--text-primary)">Agents enregistrés</span></div><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Identité</th><th>Profil</th><th>Statut</th></tr></thead><tbody><tr th:each="u:${users}"><td><div style="font-weight:600;color:var(--text-primary)" th:text="${u.nom}">Agent</div><div style="font:11px 'JetBrains Mono';color:var(--text-secondary)" th:text="${u.email}">email</div></td><td><span class="badge badge-blue" th:text="${u.role}">ROLE</span></td><td><span class="badge badge-emerald" th:if="${u.actif}">Actif</span><span class="badge badge-gold" th:unless="${u.actif}">Inactif</span></td></tr></tbody></table></div></div></div>
<div class="panel" style="margin-top:20px;padding:20px"><h3 style="font:600 14px 'Space Grotesk';color:var(--text-primary)">Demandes de réinitialisation</h3><div th:each="r:${resetRequests}" style="padding:12px 0;border-bottom:1px solid var(--border-dim);font-size:12px"><strong th:text="${r.user.nom}">Compte</strong> — <span th:text="${r.user.email}">email</span> <span class="badge badge-gold">En attente</span></div><div th:if="${#lists.isEmpty(resetRequests)}" style="color:var(--text-muted);font-size:12px;padding-top:10px">Aucune demande en attente.</div></div></section></body></html>
