<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"
th:replace="~{layouts/app :: layout(~{::section}, 'Mon profil')}"><head><title>Mon profil</title></head>
<body><section><div style="margin-bottom:24px"><span class="badge badge-blue">Compte Agent</span><h1 style="font:700 26px 'Space Grotesk';color:var(--text-primary);margin:8px 0">Mon Profil & Sécurité</h1></div>
<div class="panel" style="padding:24px;margin-bottom:20px;display:flex;align-items:center;gap:16px"><div style="width:56px;height:56px;border-radius:14px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font:700 22px 'Space Grotesk'" th:text="${#strings.substring(user.nom,0,1)}">A</div><div><h2 style="font:700 18px 'Space Grotesk';color:var(--text-primary);margin:0" th:text="${user.nom}">Agent</h2><div style="font:12px 'JetBrains Mono';color:var(--blue-hi)" th:text="${user.email}">email</div></div></div>
<form th:action="@{/profile}" method="post" class="panel" style="padding:24px"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px"><div><label class="field-label">Nom & Prénom</label><input class="field" name="nom" required th:value="${user.nom}"></div><div><label class="field-label">E-mail</label><input class="field" type="email" name="email" required th:value="${user.email}"></div><div><label class="field-label">Nouveau mot de passe</label><input class="field" type="password" name="newPassword" placeholder="Laisser vide pour conserver"></div><div><label class="field-label">Rôle</label><input class="field" disabled th:value="${user.role}"></div></div><div style="display:flex;justify-content:flex-end;margin-top:24px"><button class="btn btn-blue">Enregistrer les modifications</button></div></form></section></body></html>
